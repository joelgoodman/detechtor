name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  npm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The pattern gates never launch a browser; skip Puppeteer's Chrome download.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm test
